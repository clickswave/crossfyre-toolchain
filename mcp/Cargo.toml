[package]
name = "cfx_mcp"
version = "0.0.1"
edition = "2024"
license.workspace = true
publish.workspace = true
homepage = "https://clickswave.org"
repository = "https://github.com/clickswave/crossfyre-toolchain"
keywords = ["mcp", "scope", "pentest"]
description = "The `crossfyre mcp` server: the local engines as MCP tools, fenced by a scope file a person writes."
authors = ["Clickswave <team@clickswave.org>"]

[dependencies]
cfx_scope = { path = "../scope" }
dguard = { path = "../dguard" }
# Target inference, the internal-address classification and the HTTP client, so a
# destination means here exactly what it means to the engines.
transport = { path = "../transport" }
# The Cloud API's shapes, shared with the platform.
cfx_cloud_wire = { path = "../cloud_wire" }
# HTTPS to the Cloud API: the reqwest and rustls that transport already brings, so
# there is no second TLS stack, with no redirect ever followed.
reqwest = { version = "0.12.22", default-features = false, features = ["rustls-tls"] }
# Pinned: the protocol layer is upgraded on purpose, with the tools/list snapshot
# test updated in the same change.
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io", "elicitation"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0.3"
sha2 = "0.10"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4.38", default-features = false, features = ["now"] }

[target.'cfg(unix)'.dependencies]
# geteuid, to refuse a scope file that belongs to another user.
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
