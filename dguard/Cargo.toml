[package]
name = "dguard"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
authors = ["Crossfyre"]
description = "Inbound listener policy for the Crossfyre engine daemons"
homepage = "https://crossfyre.io"
repository = "https://github.com/clickswave/crossfyre-toolchain"
keywords = ["security"]

[dependencies]
# The per-user config directory the toolchain directory is found in.
dirs = "6"
serde_json = "1"
tokio = { version = "1", features = ["time", "macros", "rt", "net", "io-util", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["time", "macros", "rt", "rt-multi-thread", "sync"] }
