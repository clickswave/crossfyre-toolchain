[workspace]
resolver = "3"
members = ["capture", "core", "node", "crossfyre", "tui", "ambulo", "voyage", "doorward", "toolmark", "plessor", "finding", "oast", "transport", "dguard", "mobile/rust", "relsign", "scope", "spec", "surface", "cfx-script", "mcp", "bridge", "cloud_wire", "tunnel"]

# `relsign` signs the release manifest and is a BUILD-HOST tool, not a shipped
# component: the release build does not package it, so it is never uploaded or
# listed in the manifest. It is a workspace member so CI compiles and lints it
# like everything else, because a signing tool that silently stopped building
# would be discovered at a release.
# `adaptive` is a path dependency of the engines, not a workspace member: the
# .cargo/config.toml `paths` override swaps it for the git-ignored tuned drop-in
# `adaptive-private` in first-party builds, and Cargo cannot override a member.
# Both are excluded so a member (the stub or the drop-in, same package name) is
# still built as a dependency but not as a standalone member.
# `vendor` holds third-party crates patched in below. They are dependencies, not
# members, so the workspace's tests, lints and formatting leave them as published.
exclude = ["adaptive", "adaptive-private", "vendor"]

# Every crate here is Apache-2.0, the licence in LICENSE, and none is published to
# crates.io. A publish there is permanent and would fix a name and a licence for good,
# so it is refused until a crate is deliberately made a release channel, under a
# crossfyre-* name rather than the cfx_* names, which belong to CitizenFX there. This
# table sits after every [workspace] key on purpose: a key below it would land in it.
[workspace.package]
license = "Apache-2.0"
publish = false

# `mobile/rust` (cfx_mobile) is the Android Tracer's native core: a JNI cdylib
# that reuses `capture`. It is a full member, with no CI carve-out.
#
# That was not the expectation. It looked like it would need excluding from the
# build job because CI has no Android NDK, but the crate compiles for the host
# target perfectly well: `jni` builds anywhere, and nothing in it is
# Android-only at compile time. Verified against exactly what CI runs (check,
# build --all-targets, test, fmt --check, clippy -D warnings), all green.
#
# So CI proves the crate compiles and lints, but NOT that it cross-compiles for
# Android. That gap is real and is covered by the release's reproducible-build
# check instead, which does a genuine `cargo ndk` build.
# If a future change makes this host-hostile, exclude it from the build job
# rather than dropping it from the workspace: the `cfx_capture` path dependency
# resolves because it is a member.

# lru 0.13.0 with two upstream soundness fixes that lru shipped only in later
# releases: `IterMut::next` and `next_back` take a shared reference to the key
# (GHSA-rhfx-m35p-ff5j, RUSTSEC-2026-0002, fixed in 0.16.3), and `pop` unlinks a
# node before it frees it and drops the key (RUSTSEC-2026-0253, fixed in 0.18.2).
# The one user of lru 0.13 is wreq 5.3.0 in the `impersonate` build, and no wreq
# release before 0.16 accepts a fixed lru. The copy is the crates.io 0.13.0 package
# with upstream's own change for each applied and nothing else. The patch matches the
# ^0.13 requirement only; ratatui's lru 0.18 still comes from crates.io. Drop this
# once wreq moves past lru 0.13.
[patch.crates-io]
lru = { path = "vendor/lru-0.13.0" }
