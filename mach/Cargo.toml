[package]
name = "mach"
version = "0.0.14"
edition = "2024"
homepage = "https://clickswave.org"
repository = "https://github.com/clickswave/crossfyre_toolchain"
keywords = ["asset-discovery", "security", "red-teaming", "stateful"]
authors = ["Clickswave <team@clickswave.org>"]

[features]
# Opt-in adaptive-pacing telemetry in the TUI and scanner.
#
# This MUST forward to cfx_tui/tuning, not be an empty list: `cfx_tui` gates
# `pub mod tuning` and `Dashboard::tuning()` behind its own feature of the same
# name, so an empty declaration here enables our `#[cfg(feature = "tuning")]`
# blocks while leaving the items they reference compiled out of the dependency.
tuning = ["cfx_tui/tuning"]
# First-party builds enable this to swap the scan client to wreq (BoringSSL) for
# real browser TLS/HTTP2 fingerprints. Off by default (open build stays reqwest).
impersonate = ["transport/impersonate"]

[dependencies]
dguard = { path = "../dguard" }
adaptive = { path = "../adaptive" }
transport = { path = "../transport" }
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "process", "time"] }
clap = { version = "4.5.42", features = ["derive"] }
whoami = { version = "2.0.0-pre.2", features = [] }
serde = { version = "1.0.219", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
sha2 = "0.10.9"
serde_json = { version = "1.0.142", features = [] }
reqwest = { version = "0.12.22", default-features = false, features = ["rustls-tls", "http2", "charset", "cookies"] }
cfx_tui = { path = "../tui" }
ratatui = { version = "0.30.0-alpha.5", features = ["crossterm"] }
crossterm = "0.29.0"
csv = { version = "1.3.1"}
rand = "0.9.2"
regex = "1"
uuid = { version = "1.18.0", features = ["v4"] }
base64 = "0.22.1"
toml = "0.8"
dirs = "5"
dialoguer = "0.11"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
