[package]
name = "cfx-script"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
description = "Runs one .cfx script in an embedded Python interpreter, for the node and the CLI. A separate binary so that they do not link libpython and start on any Linux whatever its Python."

[dependencies]
# For the engine ports in the host's config.toml, so a script reaches mach and
# voyage where the operator moved them.
cfx_core = { path = "../core" }
# The wire encoding the engine daemons speak, for extensions.get("mach") and the like.
dguard = { path = "../dguard" }
# dup2, to move the messages off fd 1 before Python starts.
libc = "0.2"
pyo3 = { version = "0.29", features = ["auto-initialize"] }
pythonize = "0.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
