# F-Droid metadata for Crossfyre Mobile, the direct-download build.
#
# NOT SUBMITTED. This is the recipe, kept in-tree so it stays in step with the
# build it describes. Submitting means opening a merge request against
# gitlab.com/fdroid/fdroiddata with this file at
# metadata/io.crossfyre.mobile.yml, and that has to be done by a person with an
# account, under their own name. (Before 0.2.0 the app was Crossfyre Tracer,
# io.crossfyre.tracer, which was never submitted either.)
#
# The important line is `Binaries`. It asks F-Droid to build from source, compare
# byte-for-byte against OUR signed APK, and on a match distribute ours rather
# than one signed with their key. Without it, an F-Droid install and a direct
# download are different applications to Android and can never update each other,
# which users discover when an update fails.
#
# That only works because the build is reproducible. Verify before submitting:
# two clean builds must produce the same `contentSha256`. F-Droid's build server
# runs the equivalent check in public, so a failure there is a public failure.

# The app sends what it captures to a Crossfyre workspace, and the direct build
# asks a hosted service to patch apps. Neither server is open source, which is
# what this flag is for, and F-Droid would add it on review anyway.
AntiFeatures:
  NonFreeNet:
    en-US: Captured requests go to a Crossfyre workspace, and patching an app uses a hosted service. Neither server is open source.

Categories:
  - Security
  - Development

License: Apache-2.0
AuthorName: Clickswave Labs Private Limited
AuthorEmail: team@crossfyre.io
WebSite: https://crossfyre.io
SourceCode: https://github.com/clickswave/crossfyre-toolchain
IssueTracker: https://github.com/clickswave/crossfyre-toolchain/issues

AutoName: Crossfyre Mobile

Summary: Capture your phone's own app traffic for authorized testing

Description: |-
    Crossfyre Mobile captures the HTTP and HTTPS requests that apps on your phone
    make, so you can test apps you own or are authorized to test, without root
    and without a computer. Each request goes on to where it was going, and a
    record of it goes to your Crossfyre workspace.

    It runs as a local VpnService and reads HTTPS with a certificate generated
    on the device. This is not a VPN in the usual sense: nothing is tunnelled to
    a remote server, and the phone's address does not change.

    What it does to your traffic, stated plainly, because you should not have to
    infer it:

    * The CA certificate is generated on the device and its private key never
      leaves it.
    * Apps that trust that certificate are read; apps that do not refuse the
      connection, and the app says so.
    * Nothing is captured or sent before you connect the app to a workspace, by
      signing in or by scanning a pairing code. Then the method, host, path and
      status of each request go to that workspace. Headers and bodies go only if
      you turn on full requests on the phone.
    * You choose which apps are in scope. A notification with a Stop button
      shows for as long as capture runs.

    Certificate-pinned apps reject even a trusted certificate. Working around
    that means rewriting the target app, which this build can request from a
    hosted service that needs an account. That service is not open source;
    everything that runs on your phone is.

    Capture only traffic you are entitled to capture.

RepoType: git
Repo: https://github.com/clickswave/crossfyre-toolchain.git

# An earlier version of this entry read as ready and was not: it named a tag
# that was never created, described a version other than the one shipped,
# declared no product flavours, and cross-compiled one of the two ABIs the APK
# packages, so F-Droid's contentSha256 could never have matched ours. The
# comments below say how each of those is now handled.
#
# STILL REQUIRED BEFORE SUBMITTING: the tag below has to exist in the public
# repository. F-Droid clones from `Repo` and checks out `commit`, so a tag that
# only exists on a laptop fails on their builder and nowhere else.
Builds:
  - versionName: 0.2.0
    versionCode: 24
    commit: v0.2.0-mobile
    subdir: mobile/app
    # One flavour from each dimension: `prod` is the environment with no
    # applicationId suffix, the identity existing installs have, and `direct` is
    # the build with the patch feature, the one we sign and publish ourselves.
    # Building `staging` or `dev` here would publish a second app to the same
    # install base, and `play` is signed by Play and could never match ours.
    # F-Droid joins these into assembleProdDirectRelease.
    gradle:
      - prod
      - direct
    # The native core is Rust, cross-compiled before gradle runs. jniLibs is not
    # committed, so without this step the APK builds without its native library,
    # installs, and fails the moment capture starts.
    #
    # Both ABIs, matching `abiFilters` in mobile/app/build.gradle.kts. These two
    # lists have to stay equal: a target here that the APK does not package is
    # wasted build time, and one the APK packages that is missing here makes the
    # reproducible comparison fail by construction.
    sudodeps:
      - rustup
    prebuild:
      - rustup target add aarch64-linux-android x86_64-linux-android
      - cargo install cargo-ndk --locked
      - cd ../rust && cargo ndk -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release

# Distribute OUR signed APK once the reproducible build is confirmed to match.
# See the note at the top: this is the line that keeps a single install base.
Binaries: https://bins.crossfyre.io/mobile/crossfyre-mobile-%v.apk

AllowedAPKSigningKeys: 1f8b81ae5e5cc1f0f28343e216f20ea0431f6c68ad23bbfa3e5e18cb3be2e973

AutoUpdateMode: None
# None, not Tags. `Binaries` means every release needs a hand-written Builds
# entry anyway, and Tags was pointing at a tag set that does not exist.
UpdateCheckMode: None
CurrentVersion: 0.2.0
CurrentVersionCode: 24
