name: CI

# What this guards, in priority order:
#
#   1. The checkout builds as it is. What is closed comes as separate components
#      after login, and none of it is compiled into these binaries. The one
#      drop-in left, `plessor/src/authz/private.rs`, is git-ignored and compiled
#      only under plessor's `closed-authz` feature, for plessor-authz.
#
#   2. That drop-in never gets committed. A stray `git add -A` would leak it. The
#      open-core job fails the build if it appears.
#
# rustfmt and clippy are both REQUIRED: the workspace is formatted and at zero
# clippy warnings. The dependency-advisory job is enforced on the nightly
# schedule but not on push/PR, so a newly published advisory is surfaced loudly
# without blocking unrelated work; see the comment on that job.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  # Advisories land independently of our commits, so a push-only trigger means a
  # new one sits undetected until someone happens to push. See the audit job.
  schedule:
    - cron: "17 6 * * *"

# Cancel superseded runs on the same ref: this workspace is not cheap to build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fewer debug symbols; CI never runs a debugger and this is a big workspace.
  CARGO_PROFILE_DEV_DEBUG: 0
  # Deliberately NOT `-D warnings` here. The build job answers one question,
  # "does this compile and pass its tests". Lint lives in the clippy job, which
  # does use `-D warnings` now that the tree is clean.

permissions:
  contents: read

jobs:
  open-core:
    name: open-core boundary
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: The authorization drop-in must not be committed
        run: |
          set -eu
          leaked=0
          # Under any path, should the engine's directory move.
          if git ls-files | grep -qE '(^|/)authz/private\.rs$'; then
            echo "::error::the authorization drop-in is tracked in git and must never ship in the open repo"
            leaked=1
          fi
          if [ "$leaked" -ne 0 ]; then
            echo "::error::open-core boundary breached, refusing to build"
            exit 1
          fi
          echo "open-core boundary intact"

      - name: The open baseline is what actually gets compiled
        run: |
          set -eu
          test -f plessor/src/authz/baseline.rs || { echo "::error::open authz baseline missing"; exit 1; }
          test ! -e plessor/src/authz/private.rs
          echo "clean checkout resolves to the open baseline"

      # The release workflow signs provenance, so what it runs is pinned by commit
      # SHA or digest, and no third-party action shares a job with the signing
      # permissions. Checked here because a release is too late to find out.
      - name: The release workflow pins what it runs
        run: |
          set -eu
          python3 -I scripts/test_check_release_workflow.py
          python3 -I scripts/check_release_workflow.py

  build:
    name: build and test
    # The Linux jobs name their image, for the same reason the toolchain below is
    # pinned. ubuntu-latest is moving from 24.04 to 26.04 a few jobs at a time
    # (October to November 2026), and the first run here to land on 26.04 restored a
    # target directory built on 24.04 and could not link cfx-script: pyo3 still named
    # that image's Python 3.12. Moving to the next image should be a commit.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # cfx-script links libpython on Linux. Without PYO3_PYTHON, pyo3 runs the first
      # python3 on PATH and only rebuilds when PATH itself changes, not when the image
      # swaps the interpreter behind it. 3.13 is the minor version the Linux release
      # ships with cfx-script (LINUX_PYTHON in release.yml).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: python
        with:
          python-version: "3.13"

      # PYO3_PYTHON goes to every later step, so none of them builds against another
      # Python. ImageOS (ubuntu26 and the like) goes into the cache key with the
      # Python version: a target directory is only reused on the image and Python
      # it was built with. An image's weekly updates keep the same key.
      - name: Point pyo3 at that Python
        id: env
        run: |
          echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        # Pinned rather than `stable`. 1.88.0 is the real floor, set by the
        # dependency graph rather than by our own code: cookie_store, darling,
        # home and the hickory-* crates all declare rust-version 1.88. Edition
        # 2024 alone would only need 1.85, and pinning there fails with a wall of
        # "not supported by the following packages". A floating `stable` would
        # also make a green run today say nothing about tomorrow.
        #
        # Raising this is fine; lowering it needs the dependency floors checked:
        #   cargo +<older> check --workspace --locked
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustc --version && cargo --version

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ steps.env.outputs.image }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ steps.env.outputs.image }}-py${{ steps.python.outputs.python-version }}-

      - name: Check (all targets, including tests and benches)
        run: cargo check --workspace --all-targets --locked

      # Feature-gated code is invisible to a default build, which is how the
      # `tuning` pacing strip shipped in a state where it could not be enabled at
      # all: the engines used `#[cfg(feature = "tuning")]` without declaring the
      # feature, so the cfg was permanently false and the code inside was never
      # type-checked. Building the feature on is the only thing that catches that.
      - name: Check feature-gated code (tuning)
        run: |
          cargo check --locked --all-targets \
            -p ambulo -p voyage -p doorward \
            --features ambulo/tuning,voyage/tuning,doorward/tuning

      # ambulo's unit tests drive the runner's Chrome too, and need what the oracles
      # job gives it below: Chrome's sandbox does not start on the hosted runners,
      # and the default launch timeout is marginal there.
      - name: Test
        env:
          CFX_BROWSER_NO_SANDBOX: '1'
          CFX_BROWSER_LAUNCH_TIMEOUT_SECS: '90'
        run: cargo test --workspace --locked --no-fail-fast

  # The build and clippy jobs below, for each target the release workflow publishes
  # beside Linux, each on a runner of its own system and arch. Code behind cfg(unix) or
  # cfg(target_os = "linux") with no arm for the others has to fail here, on the pull
  # request that adds it, and not at a tag. The engines' tests that need Postgres or a
  # browser run in the oracles job, on Linux; anything here that needs a service the
  # runner lacks has to skip loudly, as on Linux.
  #
  # cfx-script is built for Python's stable ABI on these systems (its Cargo.toml turns
  # that on for them), so any CPython from 3.10 serves; PYO3_PYTHON names the one
  # setup-python installs, so pyo3 does not pick up another the image has first.
  build-native:
    name: build, clippy and test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # mobile/rust is the Android app's core and is built for Android, Linux and
          # macOS; it speaks to a tun device through Unix file descriptors.
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            skip: --exclude cfx_mobile
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: python
        with:
          python-version: "3.12"

      - name: Install Rust with clippy
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --no-self-update
          rustup default 1.88.0
          rustup target add ${{ matrix.target }}
          rustc --version && cargo --version

      # aws-lc-sys and BoringSSL assemble their x86_64 code with NASM on Windows, and
      # the runner image does not carry it.
      - name: Install NASM
        if: runner.os == 'Windows'
        run: |
          choco install nasm -y --no-progress
          echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: native-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: native-${{ matrix.target }}-

      - name: Check (all targets, including tests and benches)
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo check --workspace ${{ matrix.skip }} --all-targets --locked --target ${{ matrix.target }}

      - name: clippy
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo clippy --workspace ${{ matrix.skip }} --all-targets --locked --target ${{ matrix.target }} -- -D warnings

      # The four engines as the release builds them: each on its own, with BoringSSL for
      # a browser's TLS and HTTP/2 fingerprint. BoringSSL builds with MSVC on Windows and
      # not with MinGW, so this is also what shows the MSVC target is the one the release
      # can ship it on.
      - name: clippy (impersonate feature)
        run: |
          cargo clippy --locked --all-targets --target ${{ matrix.target }} \
            -p transport -p ambulo -p voyage -p toolmark -p plessor \
            --features transport/impersonate,ambulo/impersonate,voyage/impersonate,toolmark/impersonate,plessor/impersonate \
            -- -D warnings

      # The redirect tests in ambulo and cfx_core listen on 127.0.0.2 as a second
      # host. Linux and Windows answer on all of 127.0.0.0/8, and macOS only on
      # the addresses lo0 has. Both test steps below run them, so this comes first.
      - name: Give lo0 a second address
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up

      - name: test (impersonate feature, each engine as released)
        env:
          CFX_BROWSER_NO_SANDBOX: '1'
          CFX_BROWSER_LAUNCH_TIMEOUT_SECS: '90'
        run: |
          set -eu
          for p in ambulo voyage toolmark plessor; do
            cargo test --locked --no-fail-fast --target ${{ matrix.target }} -p "$p" --features impersonate
          done

      - name: Test
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo test --workspace ${{ matrix.skip }} --locked --no-fail-fast --target ${{ matrix.target }}

  oracles:
    name: detection regression
    runs-on: ubuntu-26.04
    # ambulo's daemon mode talks to postgres, so the ambulo cases need one. Without
    # it they failed on every run with "Cannot read toolchain config", and
    # because CI only triggers on main they had never run at all: they were
    # written on dev, sat there for two weeks, and first executed on the release
    # pull request that promoted 115 commits.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crossfyre
          POSTGRES_PASSWORD: crossfyre
          POSTGRES_DB: crossfyre
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Every oracle, against a target that is vulnerable in one specific way and
    # against one that is not. See tests/oracles/README.md.
    #
    # This job exists because the real guard against a detection regression used
    # to be somebody remembering to run a ninety-minute benchmark that needs
    # seventeen Docker containers, an account and a node. Nobody runs that on a
    # pull request. These need a Python fixture, a binary and a socket.
    #
    # What it actually protects is SILENCE. Every expensive mistake in this
    # engine has been an oracle that quietly stopped finding something, because a
    # negative result gets no scrutiny, so each case asserts what must NOT be
    # reported as well as what must.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0

      - name: Name the image for the cache key
        id: env
        run: echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: oracles-${{ steps.env.outputs.image }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: oracles-${{ steps.env.outputs.image }}-

      - name: Build the engines under test
        run: cargo build --locked -p plessor -p ambulo

      - name: Write the toolchain config
        # ambulo, doorward and voyage find their database through this file, and in
        # daemon mode wait, saying why, until it names one they can reach. The CLI
        # that would write it is not in this repo, and standalone terminal use never
        # reads it, so the file is the whole dependency. It names the postgres service
        # above as a database the user runs, so the engines make no cluster of their own.
        run: |
          mkdir -p ~/.config/crossfyre
          cat > ~/.config/crossfyre/config.toml <<'TOML'
          [postgres]
          backend = "external"
          host = "127.0.0.1"
          port = 5432
          user = "crossfyre"
          password = "crossfyre"
          db_name = "crossfyre"
          TOML

      - name: Run the oracle cases
        # The headless case needs a browser. The runner image ships Chrome, and the
        # runner skips that case LOUDLY rather than passing quietly if it is ever
        # absent, which is the same rule the engine follows.
        #
        # NO_SANDBOX because Chrome's setuid sandbox does not work on the hosted
        # runners. Without it the browser is found and then refuses to launch,
        # ambulo falls back to static extraction, and the case fails as two
        # missing URLs rather than as the browser problem it is.
        env:
          CFX_BROWSER_NO_SANDBOX: '1'
          # The default 20s is marginal here. The same commit launched inside it
          # on one run and missed it on another running at the same time, which
          # reported as a detection regression rather than as a slow machine.
          CFX_BROWSER_LAUNCH_TIMEOUT_SECS: '90'
        run: python3 tests/oracles/run.py

  fmt:
    name: rustfmt
    runs-on: ubuntu-26.04
    # Required. This is green as of the workspace-wide rustfmt pass, and it also
    # guards the fix that made `cargo fmt` work on a public checkout at all: the
    # authz module once declared two cfg-gated `mod imp;` arms, and rustfmt
    # resolves module paths without evaluating cfg, so it hard-errored on the
    # private path a public checkout lacks.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust with rustfmt
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.88.0
      - name: rustfmt
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-26.04
    # Required as of the clippy cleanup: the workspace is at zero warnings, and
    # `-D warnings` keeps it there. Every remaining `#[allow(...)]` in the tree
    # carries a comment saying why, so a future warning means new code, not
    # inherited debt.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust with lint components
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.88.0

      # As in the build job: cfx-script's pyo3 is checked against a named Python, and
      # the cache follows the image and that Python.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: python
        with:
          python-version: "3.13"

      - name: Point pyo3 at that Python
        id: env
        run: |
          echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: lint-${{ steps.env.outputs.image }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: lint-${{ steps.env.outputs.image }}-py${{ steps.python.outputs.python-version }}-

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: clippy (tuning feature)
        run: |
          cargo clippy --locked --all-targets \
            -p ambulo -p voyage -p doorward \
            --features ambulo/tuning,voyage/tuning,doorward/tuning -- -D warnings

      # The impersonate feature swaps the engines' HTTP client from reqwest to
      # wreq, so `transport::Error` becomes a different type and anything naming
      # reqwest directly stops compiling. The workspace build above is without it, as
      # it has to be: built together with the CLI, BoringSSL and the OpenSSL cfx_core
      # links for the trace proxy define the same symbols. Every published build turns
      # it on, building each engine on its own, so these build, lint and test each
      # engine that way. For three weeks from 2026-09-11 `ambulo` could not be
      # released at all: `fetch_reason` took a `&reqwest::Error` and the default build
      # resolved it against ambulo's own direct reqwest dependency. Found by a release
      # failing, which is the wrong way to find it.
      - name: build (impersonate feature, each engine as released)
        run: |
          set -eu
          for p in ambulo voyage toolmark plessor; do
            cargo build --locked -p "$p" --features impersonate
          done

      # Code under the impersonate feature is compiled out of the default build, so
      # the workspace clippy and test runs above never see it: transport's browser
      # profiles and the wire tests that check them against published fingerprints,
      # and plessor's certificate_policy test, which is how its raw sender was found
      # offering no TLS 1.3 suite under this feature.
      - name: clippy (impersonate feature)
        run: |
          cargo clippy --locked --all-targets \
            -p transport -p ambulo -p voyage -p toolmark -p plessor \
            --features transport/impersonate,ambulo/impersonate,voyage/impersonate,toolmark/impersonate,plessor/impersonate \
            -- -D warnings

      - name: test (impersonate feature, each engine as released)
        env:
          CFX_BROWSER_NO_SANDBOX: '1'
          CFX_BROWSER_LAUNCH_TIMEOUT_SECS: '90'
        run: |
          set -eu
          cargo test --locked -p transport --features impersonate
          for p in ambulo voyage toolmark plessor; do
            cargo test --locked --no-fail-fast -p "$p" --features impersonate
          done

      # The notices a release archive carries, for this target: a crate under a licence
      # scripts/notices/about.toml does not accept, or a new crate that compiles C code
      # of its own, shows here, on the pull request that brings it, and not at a tag.
      - name: Third-party notices
        run: |
          set -eu
          cargo install --locked cargo-about@0.9.2 --features cli
          # notices.py reads the crates offline, and cargo metadata wants those of
          # every platform, which a build for one target does not download.
          cargo fetch --locked
          python3 -I scripts/test_notices.py
          python3 -I scripts/notices.py --target x86_64-unknown-linux-gnu \
            --out "$RUNNER_TEMP/THIRD-PARTY-NOTICES.txt"

  impersonate-aarch64:
    name: impersonate feature (aarch64)
    runs-on: ubuntu-24.04-arm
    # The impersonate build, clippy and tests of the clippy job, on arm64, each engine as
    # the release builds it. BoringSSL is compiled for each target, so a break in this
    # feature that only arm64 shows would otherwise first appear in an arm64 release
    # build.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust and the BoringSSL build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.88.0 --profile minimal --component clippy --no-self-update
          rustup default 1.88.0
          rustc --version && cargo --version

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: impersonate-arm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: impersonate-arm-${{ runner.os }}-

      - name: build (impersonate feature, aarch64, each engine as released)
        run: |
          set -eu
          for p in ambulo voyage toolmark plessor; do
            cargo build --locked -p "$p" --features impersonate
          done

      - name: clippy (impersonate feature, aarch64)
        run: |
          cargo clippy --locked --all-targets \
            -p transport -p ambulo -p voyage -p toolmark -p plessor \
            --features transport/impersonate,ambulo/impersonate,voyage/impersonate,toolmark/impersonate,plessor/impersonate \
            -- -D warnings

      - name: test (impersonate feature, aarch64, each engine as released)
        env:
          CFX_BROWSER_NO_SANDBOX: '1'
          CFX_BROWSER_LAUNCH_TIMEOUT_SECS: '90'
        run: |
          set -eu
          cargo test --locked -p transport --features impersonate
          for p in ambulo voyage toolmark plessor; do
            cargo test --locked --no-fail-fast -p "$p" --features impersonate
          done

  android:
    name: Android app
    runs-on: ubuntu-26.04
    # The app's unit tests, and its native core built for the two ABIs it ships.
    # The host jobs above compile mobile/rust for Linux and macOS only, and before
    # this job nothing in CI ran the Kotlin tests at all.
    #
    # Neither step needs a secret. Without keystore.properties the app builds
    # unsigned, and without firebase.properties it builds with no push, which is
    # how a contributor's checkout builds too. The unit tests run on the JVM and
    # never load the native library, so the two steps are independent.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Gradle fails on a newer JDK with nothing but its version as the message.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # :app:test is every variant, three environments by two builds by debug and
      # release, and their Kotlin compiles share one compiler daemon, as many at
      # once as Gradle has workers. At the 2 GB it inherits from gradle.properties,
      # a clean build runs it out of memory. Four workers at 3 GB is a clean build
      # that passes, and matches the runner's four cores.
      - name: Unit tests
        working-directory: mobile
        run: >-
          ./gradlew :app:test --no-daemon --console=plain --max-workers=4
          -Pkotlin.daemon.jvmargs=-Xmx3g

      - name: Install Rust with the Android targets
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update \
            --target aarch64-linux-android,x86_64-linux-android
          rustup default 1.88.0
          rustc --version && cargo --version

      - name: Name the image for the cache key
        id: env
        run: echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: android-${{ steps.env.outputs.image }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: android-${{ steps.env.outputs.image }}-

      # The NDK the release builds with, which is not the image's default. The
      # runner image carries the SDK manager to install it, and names its own
      # default NDK in both variables below, so both are pointed at this one.
      - name: Install cargo-ndk and NDK 27.2
        run: |
          set -eu
          cargo install --locked cargo-ndk@4.1.2
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: Cross-compile the native core (arm64-v8a, x86_64)
        working-directory: mobile/rust
        run: cargo ndk -t arm64-v8a -t x86_64 build --locked

  audit:
    name: dependency advisories
    runs-on: ubuntu-26.04
    # The engines parse untrusted input from scan targets, so a DoS-class
    # advisory in a DNS or QUIC parser matters more here than its CVSS suggests.
    #
    # With the ignores below this is currently CLEAN, so it is enforced on
    # the daily schedule and left non-blocking on push/PR. That split is
    # deliberate: an advisory published upstream overnight would otherwise turn
    # an unrelated pull request red, and the reflex when that happens is to add
    # another --ignore. A scheduled failure is loud, is nobody's PR, and is the
    # right place to decide whether to upgrade, ignore, or drop a dependency.
    continue-on-error: ${{ github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # The ignore of RUSTSEC-2026-0459 below holds only while no build compiles
      # libsqlite3-sys. cargo tree prints nothing for a crate that is in the lock
      # file and outside the build graph, here with every feature on every target.
      - name: libsqlite3-sys stays out of every build
        run: |
          set -eu
          tree=$(cargo tree --locked --workspace --all-features --target all \
            -e normal,build -i libsqlite3-sys)
          if [ -n "$tree" ]; then
            echo "$tree"
            echo "::error::libsqlite3-sys is now compiled; upgrade it and drop the ignore of RUSTSEC-2026-0459"
            exit 1
          fi
      # Ignored by ID, with the reasoning recorded so it can be re-checked
      # rather than inherited on faith. Re-examine each whenever rsa,
      # rustls-pemfile or sqlx move.
      #
      #   RUSTSEC-2023-0071  rsa: Marvin timing sidechannel in RSA decryption.
      #     Open since 2023; the fix needs modular exponentiation reworked
      #     upstream and there is no patched release to move to.
      #
      #     We DO perform the affected operation: plessor/src/oast.rs decrypts the
      #     sealed OAST envelope with its own private key (RSA-OAEP), which is
      #     exactly what Marvin times. An earlier version of this comment claimed
      #     we only verify certificates; that was wrong.
      #
      #     It is still ignored, on narrower grounds: recovering the key needs
      #     many chosen ciphertexts AND a precise timing signal from the
      #     decryption. plessor decrypts locally after polling and returns nothing
      #     timing-bearing to the target, and the keypair is generated per scan
      #     (RsaPrivateKey::new at oast.rs:86), so even a successful recovery
      #     yields a key that is already discarded. Revisit if that key ever
      #     becomes long-lived or if decryption timing becomes observable to a
      #     scan target.
      #
      #   RUSTSEC-2025-0134  rustls-pemfile unmaintained. A maintenance notice,
      #     not a vulnerability, on a crate reached via axum-server and
      #     rustls-native-certs.
      #
      #   RUSTSEC-2026-0459  libsqlite3-sys 0.30.1 bundles a SQLite with
      #     CVE-2026-119375, fixed in 0.39. It is in Cargo.lock and in no build.
      #     sqlx 0.8 names sqlx-sqlite in weak features ("sqlx-sqlite?/chrono"),
      #     and Cargo writes an optional dependency named that way into the lock
      #     file even when nothing enables it. ambulo, voyage and doorward turn on
      #     sqlx's postgres feature and not sqlite, so libsqlite3-sys is never
      #     compiled; the step above fails if that changes. No sqlx release can
      #     take the fix (0.8.6 asks for ^0.30.1, 0.9.0 for below 0.38), and
      #     cargo update cannot remove it. Drop this once an sqlx release allows
      #     0.39 and we move to it, and upgrade rather than ignore if anything
      #     starts building SQLite.
      #
      # Everything else must stay visible and get fixed.
      - name: Audit
        run: >-
          cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0134
          --ignore RUSTSEC-2026-0459
