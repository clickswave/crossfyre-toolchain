name: Release

# Publishes the OPEN build, and is careful to say so.
#
# WHAT THIS IS NOT. These artifacts are not the binaries `get.crossfyre.io`
# installs. This repo is open-core: `plessor/src/authz/private.rs`,
# `core/src/egress/private.rs` and `adaptive-private/` are git-ignored and absent
# from any public checkout, so `build.rs` compiles the `baseline.rs` stubs
# instead. A release built here therefore has no authorization oracle, no
# isolated egress and no tuned pacing. Its engines do present a browser's TLS and
# HTTP/2 fingerprint: that code is public, and every published build turns it on. The first-party build does, and nobody
# outside this company can reproduce it.
#
# Saying that plainly is the point. A release that quietly shipped a reduced
# binary under the same name as the distributed one would be worse than no
# release at all, so the notes below state the difference and the CI job that
# proves no private drop-in leaked into the tag runs before anything is built.
#
# WHAT IT BUYS. Integrity was already covered: the installer fetches
# manifest.json and checks SHA256 before it installs anything. What was missing
# is PROVENANCE, the claim that a given byte string came from a commit anyone can
# read. `actions/attest-build-provenance` binds each artifact to this workflow
# run and this commit, so `gh attestation verify` answers that without trusting
# us. That is the whole reason this file exists.

on:
  push:
    tags: ["v*"]
  # Lets a release be rehearsed against a branch without cutting a tag first.
  # Produces artifacts and attestations but never a GitHub Release.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Refuses to build at all if a private drop-in is present in the tagged tree.
  # Duplicated from ci.yml rather than referenced, because a release is exactly
  # the moment a leak would become permanent and public, and this job must not
  # depend on someone remembering that CI also ran.
  boundary:
    name: open-core boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Private drop-ins must not be in the tag
        run: |
          set -euo pipefail
          fail=0
          for p in adaptive-private .cargo/config.toml \
                   core/src/egress/private.rs plessor/src/authz/private.rs; do
            if [ -e "$p" ]; then
              echo "::error::$p is present in a clean checkout of this tag"
              fail=1
            fi
          done
          exit $fail

      - name: The open baseline is what gets compiled
        run: |
          set -euo pipefail
          test -e plessor/src/authz/baseline.rs
          test -e core/src/egress/baseline.rs
          echo "open baseline present; build.rs will select it"

  build:
    name: build ${{ matrix.target }}
    needs: boundary
    runs-on: ${{ matrix.runner }}
    # Built in bookworm so the binaries link against the same glibc the
    # distributed ones do. Building on the runner's own image would produce
    # something that refuses to start on Debian 12 and Ubuntu 22.04, which is
    # most of the machines a scan node actually runs on.
    #
    # Pinned by digest: the binaries built here are the ones attested below, so the
    # image they are built in is fixed by this commit rather than by whoever last
    # moved the tag. The tag only says where the digest was taken from (the
    # multi-arch index, so both runners resolve it); moving to a newer image is a
    # commit.
    container: rust:bookworm@sha256:ade39a710ef85f3506cffcfec3e8a24ba090badef1dff2fb798f71d878833fea
    # The container's default shell is dash, which has no `pipefail`, so every
    # `set -euo pipefail` step died before running anything. bash is present in
    # the image; naming it here rather than per-step keeps the steps readable.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            python_arch: x86_64
            python_sha256: df15fe60d3ff55bf9dcf25824b5572756bb8816ff93865a273d3301d7066a8b7
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            python_arch: aarch64
            python_sha256: 578d9da1983463ffb0c8c98ab0da2f18177f44069328eb0af847860c1eb05c3e
    env:
      # The Python cfx-script goes out with on Linux: CPython as python-build-standalone
      # builds it, the install_only_stripped archive of one release for each arch, pinned
      # by the sha256 in the matrix above. Its licence texts are committed under
      # cfx-script/linux-python for this pin, and scripts/linux_python.py refuses to
      # write the notices for another.
      LINUX_PYTHON: "3.13.18"
      LINUX_PYTHON_RELEASE: "20261026"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # BoringSSL, which ambulo, voyage, toolmark and plessor build their scan clients
      # on, needs cmake, and clang for bindgen. The image has neither.
      - name: Install the BoringSSL build tools
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends cmake clang libclang-dev

      # cfx-script, the .cfx runner, embeds Python and so links libpython; it is the
      # only binary here that does, which is what lets the CLI and node start on any
      # Linux. It is built against the CPython it goes out with, in a python folder
      # beside it, and loads that one alone, so it starts whatever Python the host has
      # or lacks. Earlier releases linked bookworm's libpython3.11 and did not start
      # on a host without exactly that library.
      #
      # The folder holds libpython and the standard library, without tkinter, IDLE,
      # turtle, ensurepip, pip, the build configuration and lib-dynload, which holds
      # only _tkinter and _dbm. linux_python.py also writes pyo3.cfg, which
      # PYO3_CONFIG_FILE names below, so pyo3 builds against this Python without
      # running it.
      - name: Fetch the CPython cfx-script goes out with
        run: |
          set -euo pipefail
          mkdir -p target
          archive="cpython-$LINUX_PYTHON%2B$LINUX_PYTHON_RELEASE-${{ matrix.python_arch }}-unknown-linux-gnu-install_only_stripped.tar.gz"
          curl -fsSL --retry 3 -o target/linux-python.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/$LINUX_PYTHON_RELEASE/$archive"
          echo "${{ matrix.python_sha256 }}  target/linux-python.tar.gz" | sha256sum -c -
          python3 -I scripts/linux_python.py folder --archive target/linux-python.tar.gz \
            --sha256 "${{ matrix.python_sha256 }}" --version "$LINUX_PYTHON" \
            --out "$PWD/target/linux-python"

      # bundled-python links cfx-script with DT_RPATH $ORIGIN/python/lib, which the
      # loader searches before LD_LIBRARY_PATH and the system's directories (see
      # cfx-script/build.rs). It changes nothing in the other binaries.
      #
      # Each binary is built on its own, as the first-party build builds it: built
      # together, the crates they share are compiled once with every feature any of
      # them asks for, and the CLI would get the engines' BoringSSL beside the OpenSSL
      # it links, which define the same symbols. The four engines are built with
      # BoringSSL, for a browser's TLS and HTTP/2 fingerprint. scripts/notices.py
      # names the same binaries and features, and its test checks this step does.
      - name: Build the workspace binaries
        run: |
          set -euo pipefail
          export PYO3_CONFIG_FILE="$PWD/target/linux-python/pyo3.cfg"
          for p in crossfyre doorward node oast; do
            cargo build --release --locked -p "$p"
          done
          # Each engine's own binary only: plessor's crate also builds plessor-authz,
          # which is a closed component and never in a release archive.
          for p in plessor ambulo voyage toolmark; do
            cargo build --release --locked -p "$p" --bin "$p" --features impersonate
          done
          cargo build --release --locked -p cfx-script --features bundled-python

      # The licences of everything compiled into these binaries, for this target, with
      # the C libraries' own files, beside the binaries.
      - name: Write the third-party notices
        run: |
          set -euo pipefail
          cargo install --locked cargo-about@0.9.2
          python3 -I scripts/notices.py --target ${{ matrix.target }} \
            --out target/THIRD-PARTY-NOTICES.txt

      # The python folder goes beside cfx-script as the first-party zip lays it out,
      # byte for byte the archive's files, with the licences of everything its
      # libpython compiles in beside the binaries.
      - name: Stage the artifacts
        id: stage
        run: |
          set -euo pipefail
          out="dist/${{ matrix.target }}"
          mkdir -p "$out"
          for b in crossfyre plessor ambulo voyage doorward toolmark node oast cfx-script; do
            cp "target/release/$b" "$out/$b"
            strip "$out/$b"
          done
          python3 -I scripts/linux_python.py check "$out/cfx-script" --version "$LINUX_PYTHON"
          cp target/THIRD-PARTY-NOTICES.txt "$out/THIRD-PARTY-NOTICES.txt"
          cp -R target/linux-python/python "$out/python"
          python3 -I scripts/linux_python.py notices --version "$LINUX_PYTHON" \
            --release "$LINUX_PYTHON_RELEASE" --out "$out/THIRD-PARTY-NOTICES-PYTHON.txt"
          tar -C "$out" -czf "crossfyre-toolchain-${{ matrix.target }}.tar.gz" .
          sha256sum "crossfyre-toolchain-${{ matrix.target }}.tar.gz" \
            > "crossfyre-toolchain-${{ matrix.target }}.tar.gz.sha256"
          cat "crossfyre-toolchain-${{ matrix.target }}.tar.gz.sha256"

      # What goes out has to start: each binary prints its version from a copy of the
      # archive unpacked elsewhere, so cfx-script finds only the python folder that
      # came with it. Given no job, cfx-script refuses the empty stdin with exit status
      # 2, which it reaches only once that Python has started.
      - name: The binaries start
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          tar -C "$dir" -xzf "crossfyre-toolchain-${{ matrix.target }}.tar.gz"
          for b in crossfyre plessor ambulo voyage doorward toolmark node oast cfx-script; do
            "$dir/$b" --version
          done
          rc=0
          "$dir/cfx-script" </dev/null || rc=$?
          test "$rc" -eq 2

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: crossfyre-toolchain-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  # macOS and Windows, on their own runners. A job container is Linux only, so these
  # cannot share the job above, and the glibc reason for that container does not
  # apply: a Mach-O or PE binary links the system libraries of the OS it runs on.
  #
  # Each target builds where it runs, so the start check at the end runs the binary
  # it is about to publish. x86_64-apple-darwin is built on the Intel image rather
  # than cross-compiled on Apple silicon for the same reason.
  build-native:
    name: build ${{ matrix.target }}
    needs: boundary
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-15
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    env:
      # The oldest macOS the binaries start on. 11 is the first release for Apple
      # silicon, and holding the Intel build to the same floor keeps one answer to
      # "which macOS does this need".
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # The C runtime linked in, so the Windows binaries need no Visual C++
      # Redistributable on the machine that runs them.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
      # Room in each macOS binary's header for the load commands cfx-script's are
      # rewritten with below; the same for every binary, so nothing is built twice.
      CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS: "-C link-arg=-Wl,-headerpad_max_install_names"
      CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: "-C link-arg=-Wl,-headerpad_max_install_names"
      # The Python cfx-script goes out with on Windows, which has none of its own:
      # python.org's embeddable package, as published.
      WINDOWS_PYTHON: "3.13.12"
      WINDOWS_PYTHON_SHA256: "76f238f606250c87c6beac75dccd35ee99070a13490555936abb6cb64ecce3d0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # cfx-script is built for Python's stable ABI on these systems and loads any
      # CPython from 3.10. PYO3_PYTHON names the interpreter it is built with, so pyo3
      # does not pick up whichever python3 the image puts first on PATH.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: python
        with:
          python-version: "3.12"

      # rust-toolchain.toml pins the compiler, and rustup installs it on first use.
      # The target is named so that rustup installs its standard library with it.
      - name: Install the Rust target
        run: |
          set -euo pipefail
          rustup target add ${{ matrix.target }}
          rustc --version && cargo --version

      # aws-lc-sys and BoringSSL assemble their x86_64 code with NASM on Windows, and
      # the runner image does not carry it. The version is named so the build does not take
      # whatever was published last; the package checks the installer's hash.
      - name: Install NASM
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          choco install nasm --version=3.2.0 -y --no-progress
          echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"

      # Each binary on its own, for the reason the Linux job gives. The runner images
      # carry the cmake and clang BoringSSL needs, and Windows the NASM above.
      - name: Build the workspace binaries
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          for p in crossfyre doorward node oast; do
            cargo build --release --locked --target ${{ matrix.target }} -p "$p"
          done
          for p in plessor ambulo voyage toolmark; do
            cargo build --release --locked --target ${{ matrix.target }} -p "$p" --bin "$p" --features impersonate
          done
          cargo build --release --locked --target ${{ matrix.target }} -p cfx-script --features abi3

      - name: Write the third-party notices
        run: |
          set -euo pipefail
          cargo install --locked cargo-about@0.9.2
          "${{ steps.python.outputs.python-path }}" -I scripts/notices.py \
            --target ${{ matrix.target }} --out target/THIRD-PARTY-NOTICES.txt

      - name: Stage the artifacts
        run: |
          set -euo pipefail
          exe=""
          [ "${{ runner.os }}" != "Windows" ] || exe=".exe"
          out="dist/${{ matrix.target }}"
          mkdir -p "$out"
          for b in crossfyre plessor ambulo voyage doorward toolmark node oast cfx-script; do
            cp "target/${{ matrix.target }}/release/$b$exe" "$out/$b$exe"
          done
          if [ "${{ runner.os }}" = "macOS" ]; then
            # cfx-script is linked against the Python this runner has. It is made to
            # load @rpath/Python instead, found in the framework python.org installs
            # or the one Homebrew does, so it runs on any Mac with either.
            lib="$(otool -L "$out/cfx-script" | awk 'NR > 1 && /Python\.framework|libpython3/ { print $1; exit }')"
            test -n "$lib"
            install_name_tool -change "$lib" @rpath/Python \
              -add_rpath /Library/Frameworks/Python.framework/Versions/Current \
              -add_rpath /opt/homebrew/opt/python3/Frameworks/Python.framework/Versions/Current \
              -add_rpath /usr/local/opt/python3/Frameworks/Python.framework/Versions/Current \
              "$out/cfx-script"
            # strip and install_name_tool rewrite the binary, which leaves the
            # signature the linker made over other bytes, and Apple silicon refuses
            # to start an arm64 binary whose signature does not match. Signed again,
            # ad hoc, after both.
            for f in "$out"/*; do
              strip "$f"
              codesign --force --sign - "$f"
              codesign --verify --strict "$f"
            done
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            # cfx-script looks for a python folder beside itself first.
            curl -fsSL -o python.zip \
              "https://www.python.org/ftp/python/$WINDOWS_PYTHON/python-$WINDOWS_PYTHON-embed-amd64.zip"
            echo "$WINDOWS_PYTHON_SHA256  python.zip" | sha256sum -c -
            mkdir -p "$out/python"
            (cd "$out/python" && 7z x -bso0 ../../../python.zip)
            rm python.zip
            test -f "$out/python/python3.dll"
          fi
          # After the macOS signing above, which strips and signs every file here.
          cp target/THIRD-PARTY-NOTICES.txt "$out/THIRD-PARTY-NOTICES.txt"
          name="crossfyre-toolchain-${{ matrix.target }}.${{ matrix.archive }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$out" && 7z a -tzip -bso0 "../../$name" .)
          else
            tar -C "$out" -czf "$name" .
          fi
          # Git Bash's sha256sum marks the file binary with "*", and macOS has shasum
          # instead, so the line is written here in the one form the Linux jobs give.
          if command -v sha256sum >/dev/null 2>&1; then
            sum="$(sha256sum "$name" | cut -d' ' -f1)"
          else
            sum="$(shasum -a 256 "$name" | cut -d' ' -f1)"
          fi
          printf '%s  %s\n' "$sum" "$name" > "$name.sha256"
          cat "$name.sha256"

      # What runs here is what goes out: each binary has to start and print its
      # version. One whose signature broke in staging, or that was built for the
      # other arch, fails here rather than on the first machine that installs it.
      #
      # cfx-script is started on Windows alone, with the Python it goes out with. On
      # macOS it loads a Python framework the runner need not have, and otool -L shows
      # it names @rpath/Python.
      - name: The binaries start
        run: |
          set -euo pipefail
          exe=""
          [ "${{ runner.os }}" != "Windows" ] || exe=".exe"
          for b in crossfyre plessor ambulo voyage doorward toolmark node oast; do
            "dist/${{ matrix.target }}/$b$exe" --version
          done
          if [ "${{ runner.os }}" = "macOS" ]; then
            otool -L "dist/${{ matrix.target }}/cfx-script"
          fi
          # Given no job, cfx-script refuses the empty stdin with exit status 2, which
          # shows it loaded with the Python beside it.
          if [ "${{ runner.os }}" = "Windows" ]; then
            rc=0
            PATH="$PWD/dist/${{ matrix.target }}/python:$PATH" \
              "dist/${{ matrix.target }}/cfx-script.exe" </dev/null || rc=$?
            test "$rc" -eq 2
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: crossfyre-toolchain-${{ matrix.target }}.${{ matrix.archive }}*
          if-no-files-found: error

  attest:
    name: attest
    needs: [build, build-native]
    runs-on: ubuntu-latest
    # `id-token` and `attestations` are what let the provenance be signed. They
    # are granted here and nowhere else in the file, so the build jobs that
    # compile third-party code cannot mint an attestation, and this job runs only
    # actions GitHub publishes. The release itself is uploaded by the job below,
    # which can write to the repository but cannot sign: an action there that
    # misbehaved could swap a file on the release, and `gh attestation verify`
    # would then refuse it.
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true

      # Linux and macOS archives are .tar.gz, the Windows one .zip. Every one of them
      # has to be here: a target whose build failed stops the release at this step
      # rather than publishing it with a platform missing.
      - name: One checksum file for the whole release
        run: |
          set -euo pipefail
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                   x86_64-apple-darwin aarch64-apple-darwin; do
            test -f "crossfyre-toolchain-$t.tar.gz.sha256"
          done
          test -f crossfyre-toolchain-x86_64-pc-windows-msvc.zip.sha256
          cat ./*.tar.gz.sha256 ./*.zip.sha256 > SHA256SUMS
          rm -f ./*.tar.gz.sha256 ./*.zip.sha256
          # Five runners on three systems wrote these lines; checking them against
          # the files here is what says they agree.
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      # The piece that removes "trust us". Verify with:
      #   gh attestation verify <file> --repo clickswave/crossfyre-toolchain
      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: |
            *.tar.gz
            *.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sha256sums
          path: SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish
    needs: attest
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sha256sums

      # The same files the job above attested, checked against the sums it wrote.
      - name: Check the archives against SHA256SUMS
        run: |
          set -euo pipefail
          rm -f ./*.tar.gz.sha256 ./*.zip.sha256
          sha256sum -c SHA256SUMS

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            *.tar.gz
            *.zip
            SHA256SUMS
          fail_on_unmatched_files: true
          body: |
            ## What this is

            The **open build** of the Crossfyre toolchain, compiled by GitHub
            Actions from this tag. Engines and templates are Apache-2.0.

            ## What this is not

            This is **not** the binary `get.crossfyre.io` installs. The repo is
            open-core: three things are absent from any public checkout.

            | not in this build | effect on this build |
            |---|---|
            | `plessor/src/authz/private.rs` | no BOLA/BFLA/BOPLA authorization oracle |
            | `core/src/egress/private.rs` | no per-node egress isolation |
            | `adaptive-private/` | untuned pacing, not the shipped governor |

            `build.rs` selects the `baseline.rs` stubs instead. The distributed
            binary includes the real implementations and cannot be reproduced
            from this source. That difference is the point of publishing this
            separately rather than pretending the two are the same artifact.

            This release also carries a standalone `oast` binary, the
            out-of-band interaction server. The first-party CLI runs the same
            server as `crossfyre oast serve`.

            ## Platforms

            | archive | runs on |
            |---|---|
            | `crossfyre-toolchain-x86_64-unknown-linux-gnu.tar.gz` | Linux on x86-64, glibc 2.36 or later |
            | `crossfyre-toolchain-aarch64-unknown-linux-gnu.tar.gz` | Linux on 64-bit ARM, glibc 2.36 or later |
            | `crossfyre-toolchain-x86_64-apple-darwin.tar.gz` | macOS 11 or later on Intel |
            | `crossfyre-toolchain-aarch64-apple-darwin.tar.gz` | macOS 11 or later on Apple silicon |
            | `crossfyre-toolchain-x86_64-pc-windows-msvc.zip` | Windows 10 or later on x86-64 |

            The macOS binaries are signed ad hoc, not with a Developer ID, so a
            copy downloaded with a browser is quarantined and Gatekeeper refuses
            to open it. Clear that once the checks below pass:
            `xattr -d com.apple.quarantine <file>`. One fetched with curl is not
            quarantined. `cfx-script` needs a Python; everything else starts without
            one. On Linux the archive carries CPython 3.13 from python-build-standalone
            in a `python` folder beside it, which it loads and no other, so it starts
            whatever Python the host has or lacks; keep the folder beside the binary
            when you move it. `THIRD-PARTY-NOTICES-PYTHON.txt` holds the licences of
            that CPython and what it compiles in. On macOS it loads CPython 3.10 or
            later from python.org's framework or Homebrew's. On Windows the zip
            carries python.org's embeddable Python in a `python` folder beside it,
            which it loads first.

            Every archive carries `THIRD-PARTY-NOTICES.txt`, the licences of the
            open source code compiled into its binaries, with those of the C
            libraries among it: BoringSSL in the four engines, which present a
            browser's TLS and HTTP/2 fingerprint, and OpenSSL, AWS-LC and Zstandard.

            ## Verifying it

            Provenance is attested, so you do not have to take our word for where
            these came from:

            ```
            gh attestation verify crossfyre-toolchain-x86_64-unknown-linux-gnu.tar.gz \
              --repo clickswave/crossfyre-toolchain
            sha256sum -c SHA256SUMS
            ```

            On macOS, `shasum -a 256 -c SHA256SUMS`. In PowerShell,
            `(Get-FileHash crossfyre-toolchain-x86_64-pc-windows-msvc.zip).Hash`
            prints the sum to compare with the line in SHA256SUMS.

            Or skip us entirely: clone the tag and `cargo build --release`.
