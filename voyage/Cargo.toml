[package]
name = "voyage"
version = "0.0.17"
edition = "2024"
license.workspace = true
publish.workspace = true
homepage = "https://clickswave.org"
repository = "https://github.com/clickswave/crossfyre-toolchain"
keywords = ["subdomain", "enumeration", "security", "recon", "stateful"]
authors = ["Clickswave <team@clickswave.org>"]

[features]
# Opt-in adaptive-pacing telemetry in the TUI and scanner.
#
# This MUST forward to cfx_tui/tuning, not be an empty list: `cfx_tui` gates
# `pub mod tuning` and `Dashboard::tuning()` behind its own feature of the same
# name, so an empty declaration here enables our `#[cfg(feature = "tuning")]`
# blocks while leaving the items they reference compiled out of the dependency.
tuning = ["cfx_tui/tuning"]
# The scan client on wreq (BoringSSL), for a real browser's TLS and HTTP/2
# fingerprint. Every published build turns it on; it needs cmake and clang. Off by
# default, so a workspace build links no BoringSSL beside the OpenSSL cfx_core uses.
impersonate = ["transport/impersonate"]

[dependencies]
# The scope entries an enum's probes keep to, read as every client reads them.
cfx_scope = { path = "../scope" }
dguard = { path = "../dguard" }
cfx_db = { path = "../db" }
adaptive = { path = "../adaptive" }
cfx_pacing = { path = "../pacing" }
transport = { path = "../transport" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Its runtime and TLS come with cfx_db, which makes every connection.
sqlx = { version = "0.8", features = ["postgres"] }
hickory-resolver = "0.26"
hickory-proto = "0.26"
ipnet = "2"
cfx_tui = { path = "../tui" }
ratatui = { version = "0.30.0-alpha.5", features = ["crossterm"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
dialoguer = "0.11"

[dev-dependencies]
# A database of a test's own, for what the engine keeps.
cfx_db = { path = "../db", features = ["testing"] }
# A recording SOCKS5 proxy and counting listeners for the egress tests.
cfx_tunnel = { path = "../tunnel", features = ["recorder"] }
