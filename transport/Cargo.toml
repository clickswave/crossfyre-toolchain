[package]
name = "transport"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
description = "Backend-agnostic outbound HTTP client for the Crossfyre engines. Default = reqwest (rustls). The `impersonate` feature swaps in wreq (BoringSSL) for browser TLS/HTTP2 fingerprint parity."

[dependencies]
# Default backend. Always compiled so the shared http/url types are available.
reqwest = { version = "0.12.22", default-features = false, features = ["rustls-tls", "http2", "charset", "cookies", "gzip", "brotli", "deflate", "zstd", "json"] }

# The connect-time destination guard resolves names on tokio's blocking pool.
tokio = { version = "1", features = ["net"] }

# `AuthSpec` deserializes straight from engine op params.
serde = { version = "1", features = ["derive"] }

# Impersonation backend (BoringSSL). Optional so the open build never requires a
# C toolchain and never ships the emulation policy. The browser profiles it
# presents are in src/emulation.rs. Every profile advertises brotli and deflate
# and most advertise zstd, so the client has to decode all of them: wreq only
# decodes the encodings whose features are on, and hands back the raw bytes for
# the rest.
wreq = { version = "5", optional = true, features = ["cookies", "gzip", "brotli", "deflate", "zstd", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "rt", "macros"] }
# tests/emulation_wire.rs: a local TLS origin that records the ClientHello and
# the HTTP/2 preface, and the hashes JA4 is made of. All four are already in the
# lock through other crates.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
sha2 = "0.10"
brotli = "8"

[features]
# Off by default: the open toolchain builds a plain reqwest client. First-party
# distribution enables this to get real browser TLS/HTTP2 fingerprints.
impersonate = ["dep:wreq"]
