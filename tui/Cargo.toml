[package]
name = "cfx_tui"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true

[dependencies]
ratatui = { version = "0.30.0-alpha.5", features = ["crossterm"] }
# osc52: copying the selected row goes through the terminal, which works over SSH
# and needs no clipboard library on the machine.
crossterm = { version = "0.29.0", features = ["osc52"] }
# Asks the terminal whether its background is dark or light, to pick the palette.
terminal-colorsaurus = "1.0.3"
unicode-width = "0.2.2"
# The scans a daemon lists, as it lists them.
serde_json = "1"
# A cell's text is mostly what a scanned target wrote.
cfx_untrusted = { path = "../untrusted" }

[features]
default = []
# Adds the live tuning panel: concurrency, pacing and posture as the run
# adapts. Off in published builds. See the note in src/tuning.rs.
tuning = []
