[package]
name = "crossfyre"
version = "0.1.37"
edition = "2024"
license.workspace = true
publish.workspace = true
homepage = "https://clickswave.org"
repository = "https://github.com/clickswave/crossfyre-toolchain"
authors = ["Clickswave <team@clickswave.org>"]

[[bin]]
name = "crossfyre"
path = "src/main.rs"

[dependencies]
cfx_core = { path = "../core" }
oast = { path = "../oast" }
clap = { version = "4.5.60", features = ["derive"] }
clap_complete = "4.6.9"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "time", "signal"] }
