[package]
name = "scout"
version = "0.0.6"
edition = "2024"
homepage = "https://clickswave.org"
repository = "https://github.com/clickswave/crossfyre_toolchain"
keywords = ["fingerprinting", "security", "recon", "service-enumeration"]
authors = ["Clickswave <team@clickswave.org>"]

[dependencies]
dguard = { path = "../dguard" }
cfx_finding = { path = "../finding" }
cfx_tui = { path = "../tui" }
ratatui = { version = "0.30.0-alpha.5", features = ["crossterm"] }
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }
clap = { version = "4.5.42", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
adaptive = { path = "../adaptive" }
transport = { path = "../transport" }
reqwest = { version = "0.12.22", default-features = false, features = ["rustls-tls", "http2", "charset", "cookies", "gzip"] }
regex = "1"
base64 = "0.22.1"
md5 = "0.7"
uuid = { version = "1.18.0", features = ["v4"] }

[features]
# First-party builds enable this to swap the scan client to wreq (BoringSSL) for
# real browser TLS/HTTP2 fingerprints. Off by default so the open build stays on
# reqwest (rustls, no C toolchain, no emulation policy shipped).
impersonate = ["transport/impersonate"]
