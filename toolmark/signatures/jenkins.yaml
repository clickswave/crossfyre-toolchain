id: jenkins
info:
  name: Jenkins
  category: DevOps
  metadata:
    vendor: jenkins
    product: jenkins
implies: [java]
detect:
  any:
    - header: { name: x-jenkins, regex: '.' }
    - header: { name: x-jenkins-session, regex: '.' }
version:
  - header: { name: x-jenkins, regex: '^([0-9]+(?:\.[0-9]+)*)' }
