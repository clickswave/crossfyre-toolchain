id: sharepoint
info:
  name: Microsoft SharePoint
  category: CMS
implies: [iis, aspnet]
detect:
  any:
    - header: { name: microsoftsharepointteamservices, regex: '.' }
    - header: { name: sprequestguid, regex: '.' }
version:
  - header: { name: microsoftsharepointteamservices, regex: '^([0-9]+(?:\.[0-9]+)*)' }
