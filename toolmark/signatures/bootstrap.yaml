id: bootstrap
info:
  name: Bootstrap
  category: UI Framework
  metadata:
    vendor: getbootstrap
    product: bootstrap
detect:
  any:
    - html: { regex: '(?i)bootstrap(?:\.min)?\.(?:css|js)|class=.(?:container|navbar)-' }
version:
  - html: { regex: '(?i)bootstrap[@/-]([0-9]+\.[0-9]+(?:\.[0-9]+)?)' }
