id: elementor
info:
  name: Elementor
  category: WordPress Plugin
  metadata:
    vendor: elementor
    product: website_builder
    target_sw: wordpress
implies: [wordpress]
detect:
  any:
    - html: { regex: '(?:src|href)="[^"]*/wp-content/plugins/elementor/' }
    - meta: { name: generator, regex: '^Elementor ' }
version:
  - meta: { name: generator, regex: '^Elementor ([0-9]+\.[0-9]+\.[0-9]+)' }
  - html: { regex: '/wp-content/plugins/elementor/[^"]*\?ver=([0-9]+\.[0-9]+(?:\.[0-9]+)?)"' }
