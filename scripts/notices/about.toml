# cargo-about's settings for the third-party notices of the binaries a release
# publishes, which scripts/notices.py writes for each archive.
#
# A crate under a licence not accepted here stops the notices, and with them the
# release, until someone has looked at it. Earlier entries are preferred where a crate
# offers a choice. Build and dev dependencies do not reach the binaries, and the
# workspace's own crates (publish = false) need no notice. The target is given to each
# run, as the crates compiled in differ by system.
accepted = [
    "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0", "MPL-2.0",
    "OpenSSL", "Unicode-3.0", "Unicode-DFS-2016", "Unlicense", "WTFPL", "Zlib",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
workarounds = ["ring", "rustls"]
