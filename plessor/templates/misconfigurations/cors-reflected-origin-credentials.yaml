id: cors-reflected-origin-credentials
info:
  name: Permissive CORS - arbitrary origin reflected with credentials
  severity: high
  description: The server reflects an attacker-supplied Origin into Access-Control-Allow-Origin AND sets Access-Control-Allow-Credentials:true. Any malicious site can then make credentialed cross-origin requests and read authenticated responses on behalf of a logged-in victim (session/token theft, account data exfiltration). Confirmed by sending a unique sentinel Origin and observing it echoed back alongside allow-credentials. A wildcard `*` origin without credentials is NOT flagged here (it cannot carry cookies) -- only the credentialed reflected-origin case.
  tags: cors,misconfig,access-control
  metadata:
    category: misconfigurations
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/api"
      - "{{BaseURL}}/api/v1"
      - "{{BaseURL}}/api/v1/users/1"
      - "{{BaseURL}}/api/v2/user/dashboard"
      - "{{BaseURL}}/rest/user/whoami"
      - "{{BaseURL}}/graphql"
    headers:
      Origin: https://plessor-cors-probe.evil.example
    matchers-condition: and
    matchers:
      # the attacker origin was reflected into ACAO
      - type: word
        part: header
        words:
          - "plessor-cors-probe.evil.example"
      # ...and credentials are allowed on that cross-origin response
      - type: word
        part: header
        words:
          - "access-control-allow-credentials"
