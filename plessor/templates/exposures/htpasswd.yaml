id: htpasswd-exposure
info:
  name: Exposed .htpasswd
  severity: high
  description: A readable .htpasswd exposes usernames and password hashes (bcrypt/apr1/SHA), which can be cracked offline to gain authenticated access.
  tags: exposure,htpasswd,credentials
  metadata:
    category: exposures
http:
  - method: GET
    path:
      - "{{BaseURL}}/.htpasswd"
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "(?m)^[A-Za-z0-9._-]+:\\$(2[aby]|apr1|1|6)\\$"
      - type: status
        status:
          - 200
