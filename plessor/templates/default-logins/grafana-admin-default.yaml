id: grafana-default-admin
info:
  name: Grafana default admin credentials
  severity: high
  description: Grafana accepts the default admin/admin login, granting full dashboard and datasource control (and, via datasource proxying, a path to SSRF and internal access).
  tags: default-login,grafana
  metadata:
    category: default-logins
    vendor: grafana
    product: grafana
http:
  - method: POST
    path:
      - "{{BaseURL}}/login"
    headers:
      Content-Type: application/json
    body: '{"user":"admin","password":"admin"}'
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"message":"Logged in"'
      - type: status
        status:
          - 200
