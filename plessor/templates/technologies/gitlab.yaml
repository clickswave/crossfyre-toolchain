id: tech-gitlab
info:
  name: GitLab detected
  severity: info
  description: The GitLab sign-in page identifies a self-managed GitLab instance, whose version gates a long history of high-impact CVEs.
  tags: tech,gitlab,git,devops
  metadata:
    category: technologies
    vendor: gitlab
    product: gitlab
http:
  - method: GET
    path:
      - "{{BaseURL}}/users/sign_in"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "GitLab"
          - "gon.gitlab_url"
        condition: or
      - type: word
        part: header
        words:
          - "Set-Cookie: _gitlab_session"
      - type: status
        status:
          - 200
