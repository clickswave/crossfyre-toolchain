id: tech-nextjs
info:
  name: Next.js detected
  severity: info
  description: The __NEXT_DATA__ payload or the X-Powered-By header identifies a Next.js (React) application, fixing the frontend/SSR stack for follow-up checks.
  tags: tech,nextjs,react,javascript,framework
  metadata:
    category: technologies
    vendor: vercel
    product: next.js
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - 'id="__NEXT_DATA__"'
      - type: word
        part: header
        words:
          - "X-Powered-By: Next.js"
