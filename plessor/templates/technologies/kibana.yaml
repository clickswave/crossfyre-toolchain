id: tech-kibana
info:
  name: Kibana detected
  severity: info
  description: The kbn-name / kbn-version headers identify an Elastic Kibana instance, which is frequently exposed without authentication and fronts Elasticsearch.
  tags: tech,kibana,elastic,monitoring
  metadata:
    category: technologies
    vendor: elastic
    product: kibana
http:
  - method: GET
    path:
      - "{{BaseURL}}/app/kibana"
      - "{{BaseURL}}/api/status"
    matchers:
      - type: word
        part: header
        words:
          - "kbn-name:"
          - "kbn-version:"
        condition: or
