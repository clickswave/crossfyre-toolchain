id: tech-nginx
info:
  name: nginx detected
  severity: info
  description: The Server header identifies nginx, fixing the web server (and, when a version is present, its known-CVE exposure) for follow-up checks.
  tags: tech,nginx,webserver
  metadata:
    category: technologies
    vendor: f5
    product: nginx
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: word
        part: header
        words:
          - "Server: nginx"
