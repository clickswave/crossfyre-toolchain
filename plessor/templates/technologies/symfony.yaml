id: tech-symfony
info:
  name: Symfony (PHP) detected
  severity: info
  description: The Symfony profiler header or debug toolbar identifies the Symfony framework; the profiler leaks configuration and routes when exposed.
  tags: tech,symfony,php,framework
  metadata:
    category: technologies
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: word
        part: header
        words:
          - "X-Debug-Token:"
          - "X-Debug-Token-Link:"
        condition: or
