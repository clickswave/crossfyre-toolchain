id: tech-minio
info:
  name: MinIO detected
  severity: info
  description: The MinIO server header identifies an S3-compatible object store; check the console and anonymous bucket access.
  tags: tech,minio,storage,s3
  metadata:
    category: technologies
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: word
        part: header
        words:
          - "Server: MinIO"
