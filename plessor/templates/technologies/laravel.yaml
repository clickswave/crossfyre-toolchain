id: tech-laravel
info:
  name: Laravel (PHP) detected
  severity: info
  description: The laravel_session / XSRF-TOKEN cookies identify the Laravel framework, fixing the PHP stack and its common debug (Ignition) surface for follow-up checks.
  tags: tech,laravel,php,framework
  metadata:
    category: technologies
    vendor: laravel
    product: laravel
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: word
        part: header
        words:
          - "Set-Cookie: laravel_session"
          - "Set-Cookie: XSRF-TOKEN"
        condition: or
