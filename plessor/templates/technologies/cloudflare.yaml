id: tech-cloudflare
info:
  name: Cloudflare (CDN/WAF) detected
  severity: info
  description: The cf-ray header (and Server:cloudflare) indicate the site is fronted by Cloudflare, so origin-direct testing and WAF-evasion posture should be considered.
  tags: tech,cloudflare,cdn,waf
  metadata:
    category: technologies
    vendor: cloudflare
    product: cloudflare
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: word
        part: header
        words:
          - "Server: cloudflare"
          - "CF-RAY:"
        condition: or
