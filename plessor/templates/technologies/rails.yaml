id: tech-ruby-on-rails
info:
  name: Ruby on Rails detected
  severity: info
  description: A Rails CSRF token or session cookie identifies a Ruby on Rails application, fixing the framework for follow-up checks.
  tags: tech,rails,ruby,framework
  metadata:
    category: technologies
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: or
    matchers:
      - type: word
        part: header
        words:
          - "Set-Cookie: _rails"
          - "X-Runtime:"
      - type: word
        part: body
        words:
          - 'name="csrf-token"'
          - 'content="Ruby on Rails'
        condition: or
