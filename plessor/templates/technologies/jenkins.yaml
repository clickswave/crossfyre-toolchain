id: tech-jenkins
info:
  name: Jenkins detected
  severity: info
  description: The X-Jenkins header (and the Jenkins login page) identify a Jenkins CI server, whose script console and plugin surface are frequent RCE targets.
  tags: tech,jenkins,ci,devops
  metadata:
    category: technologies
    vendor: jenkins
    product: jenkins
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/login"
    matchers:
      - type: word
        part: header
        words:
          - "X-Jenkins:"
          - "X-Jenkins-Session:"
        condition: or
