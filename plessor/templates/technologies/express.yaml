id: tech-express
info:
  name: Express (Node.js) detected
  severity: info
  description: The X-Powered-By header advertises the Express framework, fixing the Node.js backend for follow-up checks.
  tags: tech,express,nodejs,framework
  metadata:
    category: technologies
    vendor: expressjs
    product: express
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: word
        part: header
        words:
          - "X-Powered-By: Express"
