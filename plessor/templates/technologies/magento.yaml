id: tech-magento
info:
  name: Magento detected
  severity: info
  description: The X-Magento-Vary cookie or Magento frontend assets identify the Adobe Commerce (Magento) e-commerce platform, fixing its large plugin/CVE attack surface.
  tags: tech,magento,ecommerce,php
  metadata:
    category: technologies
    vendor: adobe
    product: magento
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: or
    matchers:
      - type: word
        part: header
        words:
          - "Set-Cookie: X-Magento-Vary"
      - type: word
        part: body
        words:
          - "/static/frontend/"
          - "Magento_"
        condition: and
