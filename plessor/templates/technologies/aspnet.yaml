id: tech-aspnet
info:
  name: ASP.NET detected
  severity: info
  description: An ASP.NET version header or session cookie identifies a Microsoft .NET web stack, fixing the backend for follow-up checks.
  tags: tech,aspnet,dotnet,microsoft
  metadata:
    category: technologies
    vendor: microsoft
    product: asp.net
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: word
        part: header
        words:
          - "X-AspNet-Version:"
          - "X-Powered-By: ASP.NET"
          - "Set-Cookie: ASP.NET_SessionId"
        condition: or
