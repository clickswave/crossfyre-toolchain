id: tech-sonarqube
info:
  name: SonarQube detected
  severity: info
  description: The SonarQube web app identifies a code-quality server; its projects and tokens are worth checking for exposure.
  tags: tech,sonarqube,ci,devops
  metadata:
    category: technologies
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "SonarQube"
      - type: status
        status:
          - 200
