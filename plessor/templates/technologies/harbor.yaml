id: tech-harbor
info:
  name: Harbor registry detected
  severity: info
  description: The Harbor systeminfo API identifies a container registry; check for anonymous project/repository listing.
  tags: tech,harbor,registry,docker
  metadata:
    category: technologies
http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v2.0/systeminfo"
      - "{{BaseURL}}/api/systeminfo"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "harbor_version"
        condition: or
      - type: status
        status:
          - 200
