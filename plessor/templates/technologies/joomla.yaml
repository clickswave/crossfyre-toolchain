id: tech-joomla
info:
  name: Joomla detected
  severity: info
  description: The Joomla core manifest is readable and names the platform (and often its exact version), fixing the CMS attack surface for follow-up checks.
  tags: tech,joomla,cms
  metadata:
    category: technologies
    vendor: joomla
    product: joomla
http:
  - method: GET
    path:
      - "{{BaseURL}}/administrator/manifests/files/joomla.xml"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "files_joomla"
          - "<extension"
        condition: and
      - type: status
        status:
          - 200
