id: tech-wordpress
info:
  name: WordPress detected
  severity: info
  description: The WordPress login form and core asset paths identify the platform, fixing its plugin/theme attack surface for follow-up checks.
  tags: tech,wordpress,cms
  metadata:
    category: technologies
    vendor: wordpress
    product: wordpress
http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-login.php"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'name="log"'
          - "wp-submit"
        condition: and
      - type: status
        status:
          - 200
