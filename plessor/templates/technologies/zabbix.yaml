id: tech-zabbix
info:
  name: Zabbix detected
  severity: info
  description: The Zabbix login page identifies a monitoring server; its API and guest access have hosted several CVEs.
  tags: tech,zabbix,monitoring
  metadata:
    category: technologies
http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php"
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Zabbix"
          - "name=\"password\""
        condition: and
      - type: status
        status:
          - 200
