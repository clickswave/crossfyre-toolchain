id: tech-grafana
info:
  name: Grafana detected
  severity: info
  description: The Grafana login application identifies a Grafana dashboard, whose datasource and plugin endpoints have hosted several path-traversal and SSRF CVEs.
  tags: tech,grafana,monitoring
  metadata:
    category: technologies
    vendor: grafana
    product: grafana
http:
  - method: GET
    path:
      - "{{BaseURL}}/login"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"appSubUrl"'
          - "Grafana"
        condition: and
      - type: status
        status:
          - 200
