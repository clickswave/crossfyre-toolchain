id: tech-phpmyadmin
info:
  name: phpMyAdmin detected
  severity: info
  description: The phpMyAdmin login page is reachable, exposing a database administration console whose version has hosted multiple authentication and LFI/SQLi CVEs.
  tags: tech,phpmyadmin,database,php,panel
  metadata:
    category: technologies
    vendor: phpmyadmin
    product: phpmyadmin
http:
  - method: GET
    path:
      - "{{BaseURL}}/phpmyadmin/index.php"
      - "{{BaseURL}}/phpMyAdmin/index.php"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "pma_username"
          - "phpMyAdmin"
        condition: and
      - type: status
        status:
          - 200
