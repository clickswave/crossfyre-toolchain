id: tech-flask-werkzeug
info:
  name: Flask / Werkzeug detected
  severity: info
  description: The Werkzeug server banner or Flask session cookie identifies a Flask (Python) app; the Werkzeug debugger is a frequent RCE path when left on.
  tags: tech,flask,werkzeug,python,framework
  metadata:
    category: technologies
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: word
        part: header
        words:
          - "Server: Werkzeug"
          - "Set-Cookie: session=eyJ"
        condition: or
