id: tech-drupal
info:
  name: Drupal detected
  severity: info
  description: The X-Generator header or core JavaScript identifies Drupal, fixing the CMS platform and module attack surface for follow-up checks.
  tags: tech,drupal,cms
  metadata:
    category: technologies
    vendor: drupal
    product: drupal
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: word
        part: header
        words:
          - "X-Generator: Drupal"
  - method: GET
    path:
      - "{{BaseURL}}/core/misc/drupal.js"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Drupal"
      - type: status
        status:
          - 200
