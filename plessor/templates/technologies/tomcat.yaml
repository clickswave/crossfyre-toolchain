id: tech-apache-tomcat
info:
  name: Apache Tomcat detected
  severity: info
  description: The Coyote connector banner or the shipped docs identify Apache Tomcat, fixing the servlet container (and its manager attack surface) for follow-up checks.
  tags: tech,tomcat,apache,java,webserver
  metadata:
    category: technologies
    vendor: apache
    product: tomcat
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: word
        part: header
        words:
          - "Server: Apache-Coyote"
  - method: GET
    path:
      - "{{BaseURL}}/docs/"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Apache Tomcat"
      - type: status
        status:
          - 200
