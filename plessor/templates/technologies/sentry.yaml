id: tech-sentry
info:
  name: Sentry detected
  severity: info
  description: A reachable Sentry error-tracking instance. Its login and API surface, and the DSN it hands out, are worth checking for exposure.
  tags: tech,sentry,monitoring
  metadata:
    category: technologies
http:
  - method: GET
    path:
      - "{{BaseURL}}/auth/login/"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Sentry"
          - "csrfmiddlewaretoken"
        condition: and
      - type: status
        status:
          - 200
