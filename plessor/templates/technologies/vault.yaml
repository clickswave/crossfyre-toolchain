id: tech-hashicorp-vault
info:
  name: HashiCorp Vault detected
  severity: info
  description: The Vault health endpoint identifies a HashiCorp Vault instance. Seal status and auth backends are the next things to check.
  tags: tech,vault,hashicorp,secrets
  metadata:
    category: technologies
http:
  - method: GET
    path:
      - "{{BaseURL}}/v1/sys/health"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"initialized"'
          - '"sealed"'
        condition: and
      - type: status
        status:
          - 200
          - 429
          - 473
          - 501
          - 503
