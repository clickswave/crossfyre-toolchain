id: tech-django
info:
  name: Django admin detected
  severity: info
  description: The Django administration login page identifies a Django (Python) application, fixing the framework and its admin attack surface for follow-up checks.
  tags: tech,django,python,framework
  metadata:
    category: technologies
    vendor: djangoproject
    product: django
http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/login/"
      - "{{BaseURL}}/admin/"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Django administration"
          - 'id="id_username"'
        condition: or
      - type: status
        status:
          - 200
