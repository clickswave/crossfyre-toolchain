id: tech-consul
info:
  name: HashiCorp Consul detected
  severity: info
  description: The Consul agent API answers unauthenticated, identifying a service-discovery node; the KV store and catalog often leak internal topology.
  tags: tech,consul,hashicorp
  metadata:
    category: technologies
http:
  - method: GET
    path:
      - "{{BaseURL}}/v1/agent/self"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"Config"'
          - '"Member"'
        condition: or
      - type: status
        status:
          - 200
