id: tech-microsoft-iis
info:
  name: Microsoft IIS detected
  severity: info
  description: The Server header identifies Microsoft Internet Information Services, fixing the web server (and its version) for follow-up checks.
  tags: tech,iis,microsoft,webserver
  metadata:
    category: technologies
    vendor: microsoft
    product: iis
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: word
        part: header
        words:
          - "Server: Microsoft-IIS"
