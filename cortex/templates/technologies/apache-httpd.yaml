id: tech-apache-httpd
info:
  name: Apache httpd detected
  severity: info
  description: The Server header identifies the Apache HTTP Server, fixing the web server (and, when a version is present, its known-CVE exposure) for follow-up checks.
  tags: tech,apache,webserver
  metadata:
    category: technologies
    vendor: apache
    product: http_server
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "Server: Apache"
      # Apache-Coyote is Tomcat's connector, not the Apache HTTP Server. Matching
      # "Server: Apache" as a substring renamed every Tomcat box to Apache httpd,
      # which then points the CVE follow-ups at the wrong product entirely.
      - type: word
        part: header
        negative: true
        words:
          - "Apache-Coyote"
