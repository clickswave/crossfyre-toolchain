[package]
name = "cortex"
version = "0.0.21"
edition = "2024"
homepage = "https://clickswave.org"
repository = "https://github.com/clickswave/crossfyre_toolchain"
keywords = ["vulnerability", "security", "scanner", "dast"]
authors = ["Clickswave <team@clickswave.org>"]

[dependencies]
dguard = { path = "../dguard" }
cfx_finding = { path = "../finding" }
cfx_tui = { path = "../tui" }
ratatui = { version = "0.30.0-alpha.5", features = ["crossterm"] }
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }
clap = { version = "4.5.42", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
serde_yaml = "0.9"
adaptive = { path = "../adaptive" }
transport = { path = "../transport" }
reqwest = { version = "0.12.22", default-features = false, features = ["rustls-tls", "http2", "charset", "cookies", "gzip", "json"] }
# Raw HTTP/1.1 sender for `unsafe` templates: reqwest normalises dot-segments in
# the path before sending, which defeats path-traversal probes (CVE-2021-41773).
# These let us open a socket and write the request-target verbatim. aws-lc-rs is
# already in the tree (reqwest), so no new native build.
rustls = "0.23"
tokio-rustls = "0.26"
# Under `impersonate`, the raw sender's TLS uses BoringSSL (GREASE + a browser
# cipher/curve profile) instead of rustls, so even the verbatim-path probes
# present a browser-like handshake rather than the flagged rustls fingerprint.
# Same BoringSSL the wreq backend already links, so no new native build.
boring2 = { version = "4.15", optional = true }
tokio-boring2 = { version = "4.15", optional = true }
# OAST client-side crypto: keygen, RSA-OAEP unwrap, AES-256-GCM open.
rsa = "0.9"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
regex = "1"
uuid = { version = "1.18.0", features = ["v4"] }

[features]
# First-party builds enable this to swap the outward scan client to wreq
# (BoringSSL) for real browser TLS/HTTP2 fingerprints. Off by default so the open
# build stays on reqwest (rustls, no C toolchain, no emulation policy shipped).
impersonate = ["transport/impersonate", "dep:boring2", "dep:tokio-boring2"]
