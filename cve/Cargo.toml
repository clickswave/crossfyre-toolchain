[package]
name = "cfx_cve"
version = "0.0.1"
edition = "2024"
license.workspace = true
publish.workspace = true
homepage = "https://clickswave.org"
repository = "https://github.com/clickswave/crossfyre-toolchain"
keywords = ["cve", "cpe", "vulnerability", "security"]
description = "Load a CVE dataset and say which CVEs affect a product at a version."
authors = ["Clickswave <team@clickswave.org>"]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
# The dataset is one gzipped file.
flate2 = "1.1"
