[package]
name = "cfx_pack"
version = "0.0.1"
edition = "2024"
license.workspace = true
publish.workspace = true
homepage = "https://clickswave.org"
repository = "https://github.com/clickswave/crossfyre-toolchain"
description = "Read a pack of the templates, signatures and mappings the engines run."
authors = ["Clickswave <team@clickswave.org>"]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
# A pack is one gzipped file.
flate2 = "1.1"
