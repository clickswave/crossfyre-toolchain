[package]
name = "cfx_core"
version = "0.1.0"
edition = "2024"
homepage = "https://clickswave.org"
repository = "https://github.com/clickswave/crossfyre-toolchain"
authors = ["Clickswave <team@clickswave.org>"]

[lib]
name = "cfx_core"
path = "src/lib.rs"

[dependencies]
dguard = { path = "../dguard" }
adaptive = { path = "../adaptive" }
async-nats = "0.50.0"
# Direct handle so run_daemon can install a rustls CryptoProvider before the
# NATS TLS handshake (both aws-lc-rs and ring are in the workspace graph).
rustls = { version = "0.23", features = ["aws_lc_rs"] }
base64 = "0.21.0"
clap = { version = "4.5.60", features = ["derive"] }
dialoguer = { version = "0.12.0", features = ["password"] }
dirs = "6.0.0"
futures-util = "0.3"
libc = "0.2"
nats-jwt = "0.3.0"
nkeys = "0.4.5"
# `native-tls-vendored` adds an OpenSSL backend (statically built, so no system libssl needed and it
# cross-compiles cleanly) ALONGSIDE reqwest's default rustls. The trace proxy's forwarder opts into it
# via `.use_native_tls()` so it can reach real-world / legacy origins (old gov & enterprise sites that
# only offer RSA-kx / CBC ciphers like TLS_RSA_WITH_AES_128_CBC_SHA256, which rustls does not implement).
# Every other reqwest client keeps rustls (the default), so this changes reach for the proxy only.
reqwest = { version = "0.13.2", features = ["json", "cookies", "native-tls-vendored"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
tempfile = "3"
sysinfo = "0.33"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "time", "signal", "process", "io-util", "net"] }
# Web Tracer Method 2 (local intercepting proxy): a Burp-style MITM proxy built in-process so capture
# needs only a browser (no Wireshark). rcgen mints a session CA + per-host leaf certs; hyper serves
# HTTP/1.1 over the tokio-rustls-terminated tunnel; reqwest (above) forwards to the origin.
rcgen = "0.13"
cfx_capture = { path = "../capture" }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = "0.26"
toml = "1.0.3"
pyo3 = { version = "0.29", features = ["auto-initialize"] }
pythonize = "0.29"
