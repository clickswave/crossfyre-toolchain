[package]
name = "cfx_core"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
homepage = "https://clickswave.org"
repository = "https://github.com/clickswave/crossfyre-toolchain"
authors = ["Clickswave <team@clickswave.org>"]

[lib]
name = "cfx_core"
path = "src/lib.rs"

[dependencies]
dguard = { path = "../dguard" }
adaptive = { path = "../adaptive" }
async-nats = "0.50.0"
# Direct handle so run_daemon can install a rustls CryptoProvider before the
# NATS TLS handshake (both aws-lc-rs and ring are in the workspace graph).
rustls = { version = "0.23", features = ["aws_lc_rs"] }
base64 = "0.21.0"
clap = { version = "4.5.60", features = ["derive"] }
dialoguer = { version = "0.12.0", features = ["password"] }
dirs = "6.0.0"
futures-util = "0.3"
libc = "0.2"
nats-jwt = "0.3.0"
nkeys = "0.4.5"
# `native-tls-vendored` adds an OpenSSL backend (statically built, so no system libssl needed and it
# cross-compiles cleanly) ALONGSIDE reqwest's default rustls. The trace proxy's forwarder opts into it
# via `.use_native_tls()` so it can reach real-world / legacy origins (old gov & enterprise sites that
# only offer RSA-kx / CBC ciphers like TLS_RSA_WITH_AES_128_CBC_SHA256, which rustls does not implement).
# Every other reqwest client keeps rustls (the default), so this changes reach for the proxy only.
reqwest = { version = "0.13.2", features = ["json", "cookies", "native-tls-vendored"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
# Unpacks the lego release `crossfyre oast setup` installs, in memory, so the bytes
# whose sha256 was checked are the bytes written. Already in the graph through capture.
flate2 = "1.1"
# Verify the release manifest signature. Verification only: signing lives in the
# `relsign` dev tool so the shipped binary carries no path that produces one.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
tempfile = "3"
sysinfo = "0.33"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "time", "signal", "process", "io-util", "net"] }
# Web Tracer Method 2 (local intercepting proxy): a Burp-style MITM proxy built in-process so capture
# needs only a browser (no Wireshark). rcgen mints a session CA + per-host leaf certs; hyper serves
# HTTP/1.1 over the tokio-rustls-terminated tunnel; reqwest (above) forwards to the origin.
rcgen = "0.13"
cfx_capture = { path = "../capture" }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = "0.26"
toml = "1.0.3"

# Windows: the node supervisor runs as a service (windows-service), the engines as
# scheduled tasks registered through the Task Scheduler's COM interface (the `windows`
# crate, at the version sysinfo already brings), and the rest is plain Win32.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
